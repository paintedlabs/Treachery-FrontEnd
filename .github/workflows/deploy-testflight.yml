name: Deploy to TestFlight

on:
  push:
    branches: [main]
    paths:
      - "Treachery-iOS/**"
  workflow_dispatch:

concurrency:
  group: deploy-testflight
  # Queue rather than abort: a cancelled run can still have uploaded a build to
  # App Store Connect, and killing one mid-upload burns the build number for
  # everyone. Matches deploy-appstore.
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Upload to TestFlight
    runs-on: macos-15
    environment: staging
    defaults:
      run:
        working-directory: Treachery-iOS
    steps:
      - uses: actions/checkout@v4

      # Newest Xcode without "beta" in its name: App Store Connect rejects
      # binaries built with a beta Xcode or SDK, and runner images can carry
      # betas that would otherwise sort last. Only real app bundles count: the
      # images also add version-only symlinks (Xcode_26.0.app) that can point
      # at a beta.
      - name: Select latest stable Xcode
        run: |
          XCODE=$(for app in /Applications/Xcode*.app; do
            if [ -d "$app" ] && [ ! -L "$app" ]; then echo "$app"; fi
          done | grep -iv beta | sort -V | tail -1 || true)
          if [ -z "$XCODE" ]; then
            echo "::error::No non-beta Xcode found in /Applications. Installed:"
            ls -ld /Applications/Xcode*.app || true
            exit 1
          fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          echo "Using $XCODE"
          xcodebuild -version

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: Treachery-iOS

      # Versions come from the committed Package.resolved. Clone into the
      # directory the Fastfile's build_app calls use (SOURCE_PACKAGES), so
      # fastlane reuses these checkouts and finds Crashlytics' upload-symbols.
      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project Treachery-iOS.xcodeproj -scheme Treachery-iOS -clonedSourcePackagesDirPath build/SourcePackages

      - name: Decode signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
        run: echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $RUNNER_TEMP/build_certificate.p12

      - name: Build and upload to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          CERTIFICATE_PATH: ${{ runner.temp }}/build_certificate.p12
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 30
        run: bundle exec fastlane beta

      # Keep this build's symbols with the run, even when the lane fails after
      # the upload. The lane also uploads them to Crashlytics; this copy is for
      # re-uploads and manual symbolication.
      - name: Keep dSYMs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-dsyms-${{ github.run_id }}-${{ github.run_attempt }}
          path: Treachery-iOS/build/*.app.dSYM.zip
          retention-days: 14
          if-no-files-found: warn
