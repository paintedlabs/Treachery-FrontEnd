name: CI (Android)

on:
  pull_request:
    branches: [main]
    paths:
      - "TreacheryAndroid/**"
      # Self-trigger: a PR that only edits this workflow should still run it.
      - ".github/workflows/ci-android.yml"

concurrency:
  group: ci-android-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  # ── Android App ──────────────────────────────────────
  android-app:
    name: Android App
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: TreacheryAndroid
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: TreacheryAndroid/gradle/wrapper/gradle-wrapper.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # app/google-services.json is gitignored, so PR checkouts never carry
      # a real one and the google-services plugin needs this stand-in.
      - name: Create dummy google-services.json for CI
        run: |
          cat > app/google-services.json << 'GSJSON'
          {"project_info":{"project_number":"0","project_id":"dummy","storage_bucket":"dummy.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0","android_client_info":{"package_name":"com.solomon.treachery"}},"api_key":[{"current_key":"dummy"}]}],"configuration_version":"1"}
          GSJSON

      # testDebugUnitTest already implies both compiles; they are listed
      # explicitly so the log shows exactly which gate failed.
      - name: Compile and run unit tests
        run: ./gradlew :app:compileDebugKotlin :app:compileDebugUnitTestKotlin testDebugUnitTest --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports-${{ github.run_id }}
          path: |
            TreacheryAndroid/app/build/reports/tests/
            TreacheryAndroid/app/build/test-results/
          retention-days: 7
          if-no-files-found: ignore
