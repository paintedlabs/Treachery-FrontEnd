name: Deploy Staging

on:
  push:
    branches: [main]
    paths:
      - "Treachery/**"
      - "functions/**"
      - "firebase.json"
      - "firestore.rules"
      - "firestore.indexes.json"
      # Self-trigger so a change to the smoke check (or this workflow)
      # is actually exercised by a deploy instead of shipping untested.
      - "scripts/smoke-callables.sh"
      - ".github/workflows/deploy-staging.yml"
  workflow_dispatch:

concurrency:
  group: deploy-staging
  # Queue, never abort. Cancelling mid-`firebase deploy` kills the Cloud Build
  # jobs it has in flight, and a later run then reports every function as
  # "Failed to update" with CANCELLED builds — which is how four merges in
  # quick succession took staging down. A half-cancelled functions deploy can
  # also leave the project on a mix of old and new code. Matches
  # deploy-web-production and deploy-playstore.
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      # Never publish the privacy policy or support page with placeholders
      # (defined in src/constants/operator.ts): the staging site is public
      # too. CI checks this as well; this catches a merge that skipped CI.
      # Same check as deploy-web-production.yml.
      - name: Privacy policy and support page placeholders are filled in
        working-directory: Treachery
        run: |
          # Only grep's "no match" (1) passes. A match (0) means a placeholder
          # is left. An error (2), such as a missing folder, means the search
          # didn't finish, so it fails too.
          status=0
          grep -rnE 'TODO_(OPERATOR_NAME|CONTACT_EMAIL|EFFECTIVE_DATE)' app src || status=$?
          if [ "$status" -eq 0 ]; then
            echo "::error::Replace the privacy policy and support page placeholders listed above before deploying."
            exit 1
          elif [ "$status" -ne 1 ]; then
            echo "::error::Couldn't search app and src for privacy policy and support page placeholders (grep exit $status)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Treachery/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: Treachery

      - name: Build web app
        run: npm run build:web
        working-directory: Treachery
        env:
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          EXPO_PUBLIC_ENVIRONMENT: staging

      - name: Install functions dependencies
        run: npm ci
        working-directory: functions

      - name: Deploy to Firebase
        run: npx firebase-tools deploy --only hosting:staging,functions,firestore:rules,firestore:indexes
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      # Guards the failure mode that CI cannot see: the code is fine and the
      # deploy "succeeded", but a Cloud Run service is missing its public
      # invoker binding, so browsers get a 403 HTML page and report it as a
      # CORS error. Preflight only — never invokes a function body.
      - name: Smoke-test callables
        run: ./scripts/smoke-callables.sh "$FIREBASE_PROJECT_ID" https://treachery-staging.web.app
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
