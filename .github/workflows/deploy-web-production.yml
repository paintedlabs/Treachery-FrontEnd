name: Deploy Web to Production

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: deploy-web-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Web & Functions to Production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      # Never publish the privacy policy with its placeholders: its URL is the
      # one App Store Connect lists. CI checks this too; this catches a merge
      # that skipped CI.
      - name: Privacy policy placeholders are filled in
        working-directory: Treachery
        run: |
          # Only grep's "no match" (1) passes. A match (0) means a placeholder
          # is left. An error (2), such as a missing folder, means the search
          # didn't finish, so it fails too.
          status=0
          grep -rnE 'TODO_(OPERATOR_NAME|CONTACT_EMAIL|EFFECTIVE_DATE)' app src || status=$?
          if [ "$status" -eq 0 ]; then
            echo "::error::Replace the privacy policy placeholders listed above before deploying."
            exit 1
          elif [ "$status" -ne 1 ]; then
            echo "::error::Couldn't search app and src for privacy policy placeholders (grep exit $status)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Treachery/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: Treachery

      - name: Build web app
        run: npm run build:web
        working-directory: Treachery
        env:
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          EXPO_PUBLIC_ENVIRONMENT: production

      - name: Install functions dependencies
        run: npm ci
        working-directory: functions

      - name: Deploy to Firebase
        run: npx firebase-tools deploy --only hosting:production,functions,firestore:rules,firestore:indexes
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      # See deploy-staging.yml — catches a deploy that succeeded but left a
      # callable unreachable (missing Cloud Run invoker binding), which
      # surfaces in the browser as a misleading CORS error.
      - name: Smoke-test callables
        run: ./scripts/smoke-callables.sh "$FIREBASE_PROJECT_ID" https://treachery.games
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
