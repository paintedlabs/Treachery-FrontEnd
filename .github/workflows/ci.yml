name: CI

on:
  pull_request:
    branches: [main]

# CI only reads the repo; nothing here writes releases, comments, or
# packages, so drop the default write-scoped token.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  # ── Web ──────────────────────────────────────────────
  web-app:
    name: Web App
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Treachery
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Treachery/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build:web
        env:
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          EXPO_PUBLIC_ENVIRONMENT: ci
      # The privacy policy (app/(public)/privacy.tsx) ships with placeholders
      # for the operator's name, contact email and effective date. Its URL is
      # the one App Store Connect lists, so a PR that still has any of them
      # can't go green. Last, so the checks above still report on the PR.
      - name: Privacy policy placeholders are filled in
        run: |
          # Only grep's "no match" (1) passes. A match (0) means a placeholder
          # is left. An error (2), such as a missing folder, means the search
          # didn't finish, so it fails too.
          status=0
          grep -rnE 'TODO_(OPERATOR_NAME|CONTACT_EMAIL|EFFECTIVE_DATE)' app src || status=$?
          if [ "$status" -eq 0 ]; then
            echo "::error::Replace the privacy policy placeholders listed above."
            exit 1
          elif [ "$status" -ne 1 ]; then
            echo "::error::Couldn't search app and src for privacy policy placeholders (grep exit $status)."
            exit 1
          fi

  # ── Cloud Functions ──────────────────────────────────
  functions:
    name: Cloud Functions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run lint
      # The unit suite was previously not run in CI at all — it gated nothing.
      - run: npm test
      # The post-deploy smoke check derives its callable list from the deploy
      # manifest, and it only runs after a real deploy. Exercise the
      # derivation here so a change that breaks it fails review, not the
      # next staging or production deploy.
      - name: Smoke-check callable list resolves
        run: ../scripts/smoke-callables.sh --list

  # ── Cloud Functions integration ──────────────────────
  # Drives the REAL exported callables (wired in functions/index.js,
  # implemented in functions/src/callables/) against the emulator with
  # genuinely authenticated users. The unit suite above imports the pure
  # helpers directly, but logic inside a callable body (the ELO update, the
  # die roll, the life clamp) is only exercised here.
  functions-integration:
    name: Cloud Functions (integration)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install firebase-tools
        run: npm install -g firebase-tools@^15

      - run: npm ci
      - run: npm run test:integration

  # ── Firestore Security Rules ─────────────────────────
  # Tests firestore.rules directly against the emulator. This is the only
  # layer that can reach rules bugs: the Playwright suite drives the UI,
  # which only ever takes legitimate paths, so a rule that permits a direct
  # SDK write no client makes is invisible to it.
  firestore-rules:
    name: Firestore Rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: firestore-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firestore-tests/package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install firebase-tools
        run: npm install -g firebase-tools@^15

      - run: npm ci
      - run: npm test

  # ── Playwright E2E ───────────────────────────────────
  e2e:
    name: Web E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Treachery
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            Treachery/package-lock.json
            functions/package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install firebase-tools
        run: npm install -g firebase-tools@^15

      - name: Install Treachery deps
        run: npm ci

      - name: Install functions deps
        working-directory: functions
        run: npm ci

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browsers
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            Treachery/playwright-report
            Treachery/test-results
          retention-days: 7
          if-no-files-found: ignore
